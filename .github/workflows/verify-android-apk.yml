name: Verify released Android APK
on: workflow_dispatch
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'build-tools;35.0.0' 'platform-tools'
      - name: Download exact private release file
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download android-test-1.0 --repo "$GITHUB_REPOSITORY" --pattern 'DoseLog-Android-test.apk'
      - name: Inspect package and verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs DoseLog-Android-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging DoseLog-Android-test.apk | head -n 12
      - name: Install and open on a clean Android 15 emulator
        run: |
          sdkmanager 'emulator' 'system-images;android-35;google_apis;x86_64'
          printf 'no\n' | avdmanager create avd --force -n DoseLogTest -k 'system-images;android-35;google_apis;x86_64'
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd DoseLogTest -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/doselog-emulator.log 2>&1 &
          timeout 240 adb wait-for-device
          booted=false
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = '1' ]; then booted=true; break; fi
            sleep 2
          done
          test "$booted" = true
          adb install DoseLog-Android-test.apk
          adb shell am start -n com.personal.doselog/.MainActivity
          sleep 5
          adb shell pidof com.personal.doselog
          adb shell uiautomator dump /sdcard/window.xml
          adb shell cat /sdcard/window.xml | grep '用药记录'
