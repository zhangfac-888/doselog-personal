plugins { id 'com.android.application' }

android {
    namespace 'com.personal.doselog'
    compileSdk 35
    defaultConfig {
        // UI preview installs alongside the earlier test APK, preserving its local records.
        applicationId 'com.personal.doselog.preview2'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
